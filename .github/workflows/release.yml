name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      # Serialise so the two platforms update the release's updater latest.json
      # one after another instead of racing to overwrite it.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Restore the dependency cache warmed on main. Tag builds cannot share
      # caches with each other, so without this every release rebuilds the whole
      # dependency tree from scratch. save-if is off here: main owns the cache.
      # The macOS runner has no warmed cache and builds cold; that is expected.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-build
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      # Upload into a DRAFT release. The Windows leg finishes long before the cold
      # macOS leg, so publishing eagerly would show a release with only the .exe
      # for ~20 minutes. Keeping it a draft means nobody sees a half-built release
      # and the updater's latest.json stays pointed at the previous version until
      # both platforms are attached and the publish job flips the draft off.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kestral ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Only once BOTH platform builds succeeded does the release go live. If either
  # leg fails the release stays a draft, so a Windows-only or macOS-only release
  # is never published.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release now that both platforms are attached
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
